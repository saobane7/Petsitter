  <rect class="as" x="460" y="323" width="130" height="34" rx="17"/>
  <text class="an" x="525" y="345">PUBLIER</text>

  <rect class="as" x="135" y="66" width="130" height="34" rx="17"/>
  <text class="an" x="200" y="88">POSTULER</text>

  <rect class="as" x="775" y="66" width="130" height="34" rx="17"/>
  <text class="an" x="840" y="88">CONCERNER</text>

  <rect class="as" x="55" y="590" width="130" height="34" rx="17"/>
  <text class="an" x="120" y="612">RÉDIGER</text>

  <rect class="as" x="265" y="503" width="130" height="34" rx="17"/>
  <text class="an" x="330" y="525">ÊTRE_NOTÉ</text>

  <rect class="as" x="775" y="590" width="130" height="34" rx="17"/>
  <text class="an" x="840" y="612">PORTER_SUR</text>

  <!-- Cardinalités -->
  <text class="c" x="288" y="332">0,n</text>
  <text class="c" x="762" y="332" text-anchor="end">1,1</text>

  <text class="c" x="162" y="230">0,n</text>
  <text class="c" x="388" y="75" text-anchor="end">1,1</text>

  <text class="c" x="655" y="75">1,1</text>
  <text class="c" x="892" y="228">0,n</text>

  <text class="c" x="96" y="456">0,n</text>
  <text class="c" x="388" y="599" text-anchor="end">1,1</text>
  <text class="r" x="290" y="599" text-anchor="middle">auteur</text>

  <text class="c" x="242" y="452">0,n</text>
  <text class="c" x="438" y="553">1,1</text>
  <text class="r" x="375" y="528">cible</text>

  <text class="c" x="906" y="474">0,n</text>
  <text class="c" x="655" y="599">1,1</text>

  <!-- Notes -->
  <text class="n" x="690" y="670" font-weight="bold">Contraintes (hors cardinalités) :</text>
  <text class="n" x="690" y="688">CANDIDATURE : UNIQUE (annonce, gardien)</text>
  <text class="n" x="690" y="704">AVIS : UNIQUE (annonce, auteur) ; auteur ≠ cible</text>
  <text class="n" x="690" y="720">AVIS : note entre 1 et 5</text>
  <text class="n" x="690" y="736">ANNONCE : date_fin ≥ date_debut</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
