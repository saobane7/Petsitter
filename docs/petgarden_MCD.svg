  <text class="pk" x="407" y="66">id_candidature</text>
  <text class="a" x="407" y="88">message</text>
  <text class="a" x="407" y="110">statut (en attente | acceptee | refusee)</text>
  <text class="a" x="407" y="132">date_candidature</text>

  <!-- Entité AVIS -->
  <rect class="ent" x="395" y="560" width="250" height="126"/>
  <rect class="hd" x="395" y="560" width="250" height="28"/>
