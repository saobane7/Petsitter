<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 740" width="1060" height="740" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1060" height="740" fill="#ffffff"/>
  <style>
    .ent { fill:#ffffff; stroke:#1e40af; stroke-width:2; }
    .hd { fill:#dbeafe; stroke:#1e40af; stroke-width:2; }
    .t { font-size:14px; font-weight:bold; fill:#1e3a8a; text-anchor:middle; }
    .a { font-size:13px; fill:#111827; }
    .pk { font-size:13px; fill:#111827; font-weight:bold; text-decoration:underline; }
    .as { fill:#fef3c7; stroke:#b45309; stroke-width:2; }
    .an { font-size:13px; font-weight:bold; fill:#78350f; text-anchor:middle; }
    .ln { stroke:#374151; stroke-width:1.6; fill:none; }
    .c { font-size:13px; font-weight:bold; fill:#b91c1c; }
    .r { font-size:11px; font-style:italic; fill:#6b7280; }
    .n { font-size:11px; fill:#374151; }
  </style>

  <!-- Liaisons -->
  <path class="ln" d="M280,340 H460"/>
  <path class="ln" d="M590,340 H770"/>
  <path class="ln" d="M155,240 L200,100"/>
  <path class="ln" d="M265,83 H395"/>
  <path class="ln" d="M645,83 H775"/>
  <path class="ln" d="M840,100 L885,240"/>
  <path class="ln" d="M90,432 L120,590"/>
  <path class="ln" d="M185,607 H395"/>
  <path class="ln" d="M235,432 L330,503"/>
  <path class="ln" d="M330,537 L430,560"/>
  <path class="ln" d="M900,454 L850,590"/>
  <path class="ln" d="M775,607 H645"/>

  <!-- Entité UTILISATEUR -->
  <rect class="ent" x="30" y="240" width="250" height="192"/>
  <rect class="hd" x="30" y="240" width="250" height="28"/>
  <text class="t" x="155" y="259">UTILISATEUR</text>
  <text class="pk" x="42" y="286">id_utilisateur</text>
  <text class="a" x="42" y="308">nom</text>
  <text class="a" x="42" y="330">prenom</text>
  <text class="a" x="42" y="352">email (unique)</text>
  <text class="a" x="42" y="374">mdp</text>
  <text class="a" x="42" y="396">role (utilisateur | admin)</text>
  <text class="a" x="42" y="418">actif</text>

  <!-- Entité ANNONCE -->
  <rect class="ent" x="770" y="240" width="250" height="214"/>
  <rect class="hd" x="770" y="240" width="250" height="28"/>
  <text class="t" x="895" y="259">ANNONCE</text>
  <text class="pk" x="782" y="286">id_annonce</text>
  <text class="a" x="782" y="308">titre</text>
  <text class="a" x="782" y="330">type_animal</text>
  <text class="a" x="782" y="352">ville</text>
  <text class="a" x="782" y="374">date_debut</text>
  <text class="a" x="782" y="396">date_fin</text>
  <text class="a" x="782" y="418">description</text>
  <text class="a" x="782" y="440">statut (ouverte | pourvue | terminee)</text>

  <!-- Entité CANDIDATURE -->
  <rect class="ent" x="395" y="20" width="250" height="126"/>
  <rect class="hd" x="395" y="20" width="250" height="28"/>
