<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1120" height="700" fill="#ffffff"/>
  <style>
    .cl { fill:#ffffff; stroke:#1f2937; stroke-width:2; }
    .hd { fill:#e0f2fe; stroke:#1f2937; stroke-width:2; }
    .en { fill:#fef9c3; stroke:#1f2937; stroke-width:2; }
    .t { font-size:15px; font-weight:bold; fill:#0c4a6e; text-anchor:middle; }
    .st { font-size:11px; fill:#6b7280; text-anchor:middle; font-style:italic; }
    .a { font-size:13px; fill:#111827; }
    .ln { stroke:#374151; stroke-width:1.6; fill:none; }
    .m { font-size:13px; font-weight:bold; fill:#b91c1c; }
    .r { font-size:12px; font-style:italic; fill:#374151; }
    .n { font-size:11px; fill:#4b5563; }
  </style>

  <!-- Associations (dessinées en premier) -->
  <path class="ln" d="M290,100 H420"/>
  <path class="ln" d="M680,100 H810"/>
  <path class="ln" d="M160,40 V15 H950 V40"/>
  <path class="ln" d="M470,234 V380"/>
  <path class="ln" d="M630,234 V380"/>
  <path class="ln" d="M680,440 H950 V256"/>

  <!-- Classe Candidature -->
  <rect class="cl" x="30" y="40" width="260" height="128"/>
  <rect class="hd" x="30" y="40" width="260" height="30"/>
  <text class="t" x="160" y="61">Candidature</text>
  <text class="a" x="42" y="90">- idCandidature : int</text>
  <text class="a" x="42" y="112">- message : String</text>
  <text class="a" x="42" y="134">- statut : StatutCandidature</text>
  <text class="a" x="42" y="156">- dateCandidature : DateTime</text>

  <!-- Classe Utilisateur -->
  <rect class="cl" x="420" y="40" width="260" height="194"/>
  <rect class="hd" x="420" y="40" width="260" height="30"/>
  <text class="t" x="550" y="61">Utilisateur</text>
  <text class="a" x="432" y="90">- idUtilisateur : int</text>
  <text class="a" x="432" y="112">- nom : String</text>
  <text class="a" x="432" y="134">- prenom : String</text>
  <text class="a" x="432" y="156">- email : String {unique}</text>
  <text class="a" x="432" y="178">- mdp : String</text>
  <text class="a" x="432" y="200">- role : Role</text>
  <text class="a" x="432" y="222">- actif : boolean</text>

  <!-- Classe Annonce -->
  <rect class="cl" x="810" y="40" width="280" height="216"/>
  <rect class="hd" x="810" y="40" width="280" height="30"/>
  <text class="t" x="950" y="61">Annonce</text>
  <text class="a" x="822" y="90">- idAnnonce : int</text>
  <text class="a" x="822" y="112">- titre : String</text>
  <text class="a" x="822" y="134">- typeAnimal : String</text>
  <text class="a" x="822" y="156">- ville : String</text>
  <text class="a" x="822" y="178">- dateDebut : Date</text>
  <text class="a" x="822" y="200">- dateFin : Date</text>
  <text class="a" x="822" y="222">- description : String</text>
  <text class="a" x="822" y="244">- statut : StatutAnnonce</text>

  <!-- Classe Avis -->
  <rect class="cl" x="420" y="380" width="260" height="128"/>
  <rect class="hd" x="420" y="380" width="260" height="30"/>
  <text class="t" x="550" y="401">Avis</text>
  <text class="a" x="432" y="430">- idAvis : int</text>
  <text class="a" x="432" y="452">- note : int  {1..5}</text>
  <text class="a" x="432" y="474">- commentaire : String</text>
  <text class="a" x="432" y="496">- dateAvis : DateTime</text>

  <!-- Multiplicités et rôles : Candidature - Utilisateur -->
  <text class="m" x="296" y="92">0..*</text>
  <text class="m" x="414" y="92" text-anchor="end">1</text>
  <text class="r" x="414" y="118" text-anchor="end">gardien</text>

  <!-- Utilisateur - Annonce -->
  <text class="m" x="686" y="92">1</text>
  <text class="r" x="686" y="118">proprietaire</text>
  <text class="m" x="804" y="92" text-anchor="end">0..*</text>

  <!-- Candidature - Annonce -->
  <text class="m" x="166" y="32">0..*</text>
  <text class="m" x="944" y="32" text-anchor="end">1</text>
  <text class="r" x="555" y="11" text-anchor="middle">concerne</text>

  <!-- Avis - Utilisateur (auteur) -->
  <text class="m" x="476" y="254">1</text>
  <text class="r" x="476" y="310">auteur</text>
  <text class="m" x="476" y="372">0..*</text>

  <!-- Avis - Utilisateur (cible) -->
  <text class="m" x="636" y="254">1</text>
  <text class="r" x="636" y="310">cible</text>
  <text class="m" x="636" y="372">0..*</text>

  <!-- Avis - Annonce -->
  <text class="m" x="686" y="432">0..*</text>
  <text class="m" x="956" y="276">1</text>
  <text class="r" x="815" y="432" text-anchor="middle">concerne</text>

  <!-- Énumérations -->
  <text class="n" x="30" y="548" font-weight="bold">Énumérations</text>

  <rect class="en" x="30" y="560" width="220" height="100"/>
  <text class="st" x="140" y="577">«enumeration»</text>
  <text class="t" x="140" y="596" style="fill:#713f12">Role</text>
  <line x1="30" y1="604" x2="250" y2="604" stroke="#1f2937" stroke-width="1.5"/>
  <text class="a" x="44" y="626">utilisateur</text>
  <text class="a" x="44" y="646">admin</text>

  <rect class="en" x="300" y="560" width="240" height="100"/>
  <text class="st" x="420" y="577">«enumeration»</text>
  <text class="t" x="420" y="596" style="fill:#713f12">StatutAnnonce</text>
  <line x1="300" y1="604" x2="540" y2="604" stroke="#1f2937" stroke-width="1.5"/>
  <text class="a" x="314" y="626">ouverte</text>
  <text class="a" x="314" y="644">pourvue</text>
  <text class="a" x="314" y="662">terminee</text>

  <rect class="en" x="590" y="560" width="260" height="100"/>
  <text class="st" x="720" y="577">«enumeration»</text>
  <text class="t" x="720" y="596" style="fill:#713f12">StatutCandidature</text>
  <line x1="590" y1="604" x2="850" y2="604" stroke="#1f2937" stroke-width="1.5"/>
  <text class="a" x="604" y="626">en_attente</text>
  <text class="a" x="604" y="644">acceptee</text>
  <text class="a" x="604" y="662">refusee</text>

  <!-- Notes -->
  <text class="n" x="880" y="580" font-weight="bold">Contraintes</text>
  <text class="n" x="880" y="598">Candidature : unique (annonce, gardien)</text>
  <text class="n" x="880" y="614">Avis : unique (annonce, auteur)</text>
  <text class="n" x="880" y="630">Avis : auteur ≠ cible</text>
  <text class="n" x="880" y="646">Annonce : dateFin ≥ dateDebut</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
