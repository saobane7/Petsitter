<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1230" viewBox="0 0 1280 1230"><title>Éléments de la BDD absents de la maquette</title><rect width="1280" height="1230" fill="#F5EFDF"/><rect x="52.0" y="21.0" width="32.0" height="32.0" rx="9" fill="#1E3D2F"/><ellipse cx="68.0" cy="39.7" rx="5.1" ry="4.1" fill="#F5EFDF"/><ellipse cx="61.2" cy="35.3" rx="1.7" ry="2.5" fill="#F5EFDF" transform="rotate(-25 61.2 35.3)"/><ellipse cx="65.6" cy="30.9" rx="1.7" ry="2.5" fill="#F5EFDF" transform="rotate(-8 65.6 30.9)"/><ellipse cx="70.4" cy="30.9" rx="1.7" ry="2.5" fill="#F5EFDF" transform="rotate(8 70.4 30.9)"/><ellipse cx="74.8" cy="35.3" rx="1.7" ry="2.5" fill="#F5EFDF" transform="rotate(25 74.8 35.3)"/><text x="96.0" y="46.0" font-family="Lora" font-size="26" font-weight="700" fill="#1E3D2F">PetGarden</text><rect x="1033.3" y="24.0" width="194.7" height="28.0" rx="14.0" fill="#E6DDBC"/><text x="1130.6" y="42.5" font-family="Inter" font-size="13" font-weight="700" fill="#1E3D2F" text-anchor="middle">Maquette complémentaire</text><line x1="0.0" y1="74.5" x2="1280.0" y2="74.5" stroke="#E4DCC4" stroke-width="1"/><text x="52.0" y="120.0" font-family="Inter" font-size="13" font-weight="600" fill="#6E7D72" letter-spacing="1">PETGARDEN · BASE DE DONNÉES × MAQUETTE</text><text x="52.0" y="170.0" font-family="Lora" font-size="38" font-weight="700" fill="#1E3D2F">Ce que la BDD contient et que le Figma ne montre pas encore</text><text x="52.0" y="204.0" font-family="Inter" font-size="16" font-weight="400" fill="#6E7D72">Dix éléments de la base sans écran dans la maquette : chacun a une page proposée dans ce fichier.</text><rect x="52.0" y="250.0" width="1176.0" height="880.0" rx="20" fill="#FAF7EE" stroke="#E4DCC4" stroke-width="1"/><text x="84.0" y="292.0" font-family="Inter" font-size="12" font-weight="700" fill="#6E7D72" letter-spacing="1">ÉLÉMENT DE LA BDD</text><text x="472.0" y="292.0" font-family="Inter" font-size="12" font-weight="700" fill="#6E7D72" letter-spacing="1">TABLE · COLONNES</text><text x="952.0" y="292.0" font-family="Inter" font-size="12" font-weight="700" fill="#6E7D72" letter-spacing="1">ÉCRAN PROPOSÉ</text><line x1="76.0" y1="310.0" x2="1204.0" y2="310.0" stroke="#E4DCC4" stroke-width="1"/><text x="84.0" y="346.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">Connexion</text><text x="472.0" y="346.0" font-family="Inter" font-size="13" font-weight="400" fill="#6E7D72">utilisateur(email, mdp)</text><rect x="952.0" y="332.0" width="121.2" height="30.0" rx="15.0" fill="#C9D6BC"/><text x="1012.6" y="351.6" font-family="Inter" font-size="13" font-weight="700" fill="#1E3D2F" text-anchor="middle">01 · Connexion</text><line x1="76.0" y1="390.0" x2="1204.0" y2="390.0" stroke="#E4DCC4" stroke-width="1"/><text x="84.0" y="422.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">Inscription et choix de l’usage</text><text x="472.0" y="422.0" font-family="Inter" font-size="13" font-weight="400" fill="#6E7D72">utilisateur(nom, prenom, email, mdp, est_client, est_petsitter)</text><rect x="952.0" y="408.0" width="123.6" height="30.0" rx="15.0" fill="#C9D6BC"/><text x="1013.8" y="427.6" font-family="Inter" font-size="13" font-weight="700" fill="#1E3D2F" text-anchor="middle">02 · Inscription</text><line x1="76.0" y1="466.0" x2="1204.0" y2="466.0" stroke="#E4DCC4" stroke-width="1"/><text x="84.0" y="498.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">Création et modification d’une annonce,</text><text x="84.0" y="519.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">brouillon</text><text x="472.0" y="498.0" font-family="Inter" font-size="13" font-weight="400" fill="#6E7D72">annonces(titre, description, horaire, id_animal, id_service, statut)</text><rect x="952.0" y="484.0" width="185.7" height="30.0" rx="15.0" fill="#C9D6BC"/><text x="1044.9" y="503.6" font-family="Inter" font-size="13" font-weight="700" fill="#1E3D2F" text-anchor="middle">03 · Publier une annonce</text><line x1="76.0" y1="542.0" x2="1204.0" y2="542.0" stroke="#E4DCC4" stroke-width="1"/><text x="84.0" y="574.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">Liste publique des annonces ouvertes</text><text x="472.0" y="574.0" font-family="Inter" font-size="13" font-weight="400" fill="#6E7D72">annonces(statut = ouverte)</text><rect x="952.0" y="560.0" width="180.4" height="30.0" rx="15.0" fill="#C9D6BC"/><text x="1042.2" y="579.5" font-family="Inter" font-size="13" font-weight="700" fill="#1E3D2F" text-anchor="middle">04 · Annonces ouvertes</text><line x1="76.0" y1="618.0" x2="1204.0" y2="618.0" stroke="#E4DCC4" stroke-width="1"/><text x="84.0" y="650.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">Candidature : message, une seule par</text><text x="84.0" y="671.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">annonce</text><text x="472.0" y="650.0" font-family="Inter" font-size="13" font-weight="400" fill="#6E7D72">candidatures(message, id_annonce, id_gardien)</text><rect x="952.0" y="636.0" width="163.7" height="30.0" rx="15.0" fill="#C9D6BC"/><text x="1033.8" y="655.5" font-family="Inter" font-size="13" font-weight="700" fill="#1E3D2F" text-anchor="middle">05 · Détail et postuler</text><line x1="76.0" y1="694.0" x2="1204.0" y2="694.0" stroke="#E4DCC4" stroke-width="1"/><text x="84.0" y="726.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">Candidatures reçues : statut, date, accepter</text><text x="84.0" y="747.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">ou refuser</text><text x="472.0" y="726.0" font-family="Inter" font-size="13" font-weight="400" fill="#6E7D72">candidatures(statut, date_candidature)</text><rect x="952.0" y="712.0" width="187.9" height="30.0" rx="15.0" fill="#C9D6BC"/><text x="1045.9" y="731.5" font-family="Inter" font-size="13" font-weight="700" fill="#1E3D2F" text-anchor="middle">06 · Candidatures reçues</text><line x1="76.0" y1="770.0" x2="1204.0" y2="770.0" stroke="#E4DCC4" stroke-width="1"/><text x="84.0" y="802.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">Avis : note de 1 à 5, commentaire de 150</text><text x="84.0" y="823.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">caractères</text><text x="472.0" y="802.0" font-family="Inter" font-size="13" font-weight="400" fill="#6E7D72">avis(note, commentaire, date_avis, id_auteur, id_cible)</text><rect x="952.0" y="788.0" width="148.9" height="30.0" rx="15.0" fill="#C9D6BC"/><text x="1026.4" y="807.5" font-family="Inter" font-size="13" font-weight="700" fill="#1E3D2F" text-anchor="middle">07 · Laisser un avis</text><line x1="76.0" y1="846.0" x2="1204.0" y2="846.0" stroke="#E4DCC4" stroke-width="1"/><text x="84.0" y="878.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">Onglet « Mes animaux » (sans contenu)</text><text x="472.0" y="878.0" font-family="Inter" font-size="13" font-weight="400" fill="#6E7D72">animal(nom, id_espece, race)</text><rect x="952.0" y="864.0" width="140.2" height="30.0" rx="15.0" fill="#C9D6BC"/><text x="1022.1" y="883.5" font-family="Inter" font-size="13" font-weight="700" fill="#1E3D2F" text-anchor="middle">08 · Mes animaux</text><line x1="76.0" y1="922.0" x2="1204.0" y2="922.0" stroke="#E4DCC4" stroke-width="1"/><text x="84.0" y="954.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">Onglet « Paiement et factures » (sans</text><text x="84.0" y="975.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">contenu)</text><text x="472.0" y="954.0" font-family="Inter" font-size="13" font-weight="400" fill="#6E7D72">facture(numero, montant), paiement(statut)</text><rect x="952.0" y="940.0" width="186.9" height="30.0" rx="15.0" fill="#C9D6BC"/><text x="1045.5" y="959.5" font-family="Inter" font-size="13" font-weight="700" fill="#1E3D2F" text-anchor="middle">09 · Paiement et factures</text><line x1="76.0" y1="998.0" x2="1204.0" y2="998.0" stroke="#E4DCC4" stroke-width="1"/><text x="84.0" y="1030.0" font-family="Inter" font-size="15" font-weight="700" fill="#1E3D2F">Rôle administrateur, vérification des profils</text><text x="472.0" y="1030.0" font-family="Inter" font-size="13" font-weight="400" fill="#6E7D72">utilisateur(role, profil_verifie)</text><rect x="952.0" y="1016.0" width="146.5" height="30.0" rx="15.0" fill="#C9D6BC"/><text x="1025.3" y="1035.5" font-family="Inter" font-size="13" font-weight="700" fill="#1E3D2F" text-anchor="middle">10 · Administration</text><text x="52.0" y="1160.0" font-family="Inter" font-size="13" font-weight="400" fill="#6E7D72">Les onglets « Sécurité et mot de passe » et « Notifications » ne sont pas redessinés : ils reposent sur utilisateur.mdp et utilisateur.notifications_email, déjà dans la</text><text x="52.0" y="1180.0" font-family="Inter" font-size="13" font-weight="400" fill="#6E7D72">base.</text></svg>